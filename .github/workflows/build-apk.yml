
name: Sestavit BroZam TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Sestavit APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Najit projekt a sestavit APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Hledam Android projekt..."

          PROJECT_FILE=$(find . -type f \
            -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "CHYBA: Projekt nebyl nalezen."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Projekt nalezen: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Pripravit APK ke stazeni
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} apk-output/ \;

          if ! compgen -G "apk-output/*.apk" > /dev/null; then
            echo "CHYBA: APK nebylo nalezeno."
            exit 1
          fi

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: BroZam-TV-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
