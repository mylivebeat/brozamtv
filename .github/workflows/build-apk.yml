
name: Sestavit BroZam TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Sestavit APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pripravit podpisovy klic
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BROZAM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BROZAM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/brozam-tv.jks"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PW="$KEYSTORE_PASSWORD"
            echo "Pevny podpisovy klic pripraven."
          else
            # Bez secrets: docasny klic (jako drive), aktualizace pres
            # starou verzi pak nejde a v TV je nutne ji odinstalovat.
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -alias brozam -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$PW" -keypass "$PW" -dname "CN=BroZam TV docasny" >/dev/null 2>&1
            echo "::warning::Chybi secrets BROZAM_KEYSTORE_B64 / BROZAM_KEYSTORE_PASSWORD - APK je podepsane docasnym klicem."
          fi

          echo "BROZAM_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "BROZAM_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Najit projekt a sestavit APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Hledam Android projekt..."

          PROJECT_FILE=$(find . -type f \
            -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "CHYBA: Projekt nebyl nalezen."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Projekt nalezen: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Pripravit APK ke stazeni
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} apk-output/ \;

          if ! compgen -G "apk-output/*.apk" > /dev/null; then
            echo "CHYBA: APK nebylo nalezeno."
            exit 1
          fi

      - name: Overit podpis APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for f in apk-output/*.apk; do
            echo "== $f"
            "$APKSIGNER" verify --verbose --print-certs "$f" 2>&1 | grep -vi "^WARNING" || true
          done

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: BroZam-TV-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
