
name: Sestavit BroZam TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Sestavit APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sestavit Android APK
        working-directory: TCL odpalovač
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: BroZam-TV-APK
          path: TCL odpalovač/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
