
name: Sestavit BroZam TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Sestavit APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zkontrolovat Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -f "TCL odpalovač/settings.gradle"
          test -f "TCL odpalovač/build.gradle"

      - name: Sestavit APK
        working-directory: TCL odpalovač
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: BroZam-TV-APK
          path: TCL odpalovač/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
