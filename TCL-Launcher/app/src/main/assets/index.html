
<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BroZam TV</title>

<style>
:root {
  --blue: #13cfff;
  --fg: #ffffff;
  --panel: #091d35ee;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--fg);
  background: #031126;
  font-family: Arial, Roboto, sans-serif;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
#scene {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: #031126 url('bg.jpg') no-repeat;
  /* Mírně zvětšeno a posunuto, aby slunce bylo vidět nad dlaždicemi */
  background-size: 112% auto;
  background-position: 9% 100%;
}
.shade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    #010b1b99, transparent 20%,
    #06152d55 48%, #000a19d0 100%
  );
}
main {
  position: relative;
  height: 100vh;
  padding: 1.3vw 2.4vw 2vw;
  display: flex;
  flex-direction: column;
  gap: 1.4vh;
}
header {
  display: flex;
  align-items: center;
  gap: 1.5vw;
  min-height: 7.5vh;
  border-bottom: 1px solid #cddfff55;
  padding-bottom: 1vh;
}
.logo {
  display: flex;
  align-items: center;
  gap: .7vw;
  font-weight: 800;
  font-size: 1.8vw;
  white-space: nowrap;
  color: white;
}
.logo-ico {
  width: 1.9vw;
  height: 1.9vw;
}
.nav {
  display: flex;
  align-items: center;
  gap: .55vw;
  flex: 1;
}
.nav button {
  border: 1px solid transparent;
  background: #04172ad9;
  border-radius: 2vw;
  padding: .7vw .9vw;
  font-size: 1.13vw;
  font-weight: 700;
  white-space: nowrap;
}
.nav button.selected {
  background: linear-gradient(135deg,#20dfff,#0481db);
  color: white;
  box-shadow: 0 0 17px #00bfff88;
  border-color: #66eaff;
}
.nav button:hover,
.tile:hover,
.action:hover {
  filter: brightness(1.15);
}
button:focus {
  outline: 3px solid #14cfff;
  outline-offset: 2px;
  box-shadow: 0 0 15px 4px #07cfffaa;
}
header .right {
  margin-left: auto;
  font-size: 1.9vw;
  font-weight: 800;
  white-space: nowrap;
  border-left: 1px solid #ffffff55;
  padding-left: 1.6vw;
}
#dashboard {
  text-shadow: 0 2px 10px #000c, 0 0 2px #0009;
  display: flex;
  align-items: center;
  height: 21vh;
  gap: 2vw;
}
.clock {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.time {
  font-size: 6.7vw;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.3vw;
  text-shadow: 0 4px 12px #0006;
}
.date {
  font-size: 1.5vw;
  font-weight: 700;
  margin-top: 1vh;
}
.weather {
  /* Blok počasí jen tak široký, jak je potřeba, zarovnaný doprava */
  margin-left: auto;
  border-left: 2px solid #ffffffaa;
  padding-left: 1.8vw;
  display: flex;
  gap: 3.5vw;
  align-items: center;
}
.place {
  font-weight: 700;
  font-size: 1.25vw;
}
.now-row {
  display: flex;
  align-items: center;
  gap: 1vw;
  margin-top: .6vh;
}
.now-ico { font-size: 3.4vw; line-height: 1; }
.temperature {
  font-size: 3.6vw;
  font-weight: 800;
  line-height: 1.1;
}
.description { font-size: 1.2vw; color: #e3eefa; }
.fc {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .8vh;
}
.fc-title {
  font-size: 1.15vw;
  font-weight: 700;
}
.forecast {
  display: flex;
  gap: .5vw;
  align-items: center;
}
.forecast section {
  border-left: 1px solid #ffffff65;
  padding: 0 .85vw;
  text-align: center;
  min-width: 6.5vw;
  font-size: 1.13vw;
}
.forecast section:first-child { border-left: 0; }
.forecast .day { font-weight: 700; }
.forecast .ico { font-size: 2.1vw; margin: .3vh 0; }
.forecast strong { font-size: 1.1vw; white-space: nowrap; }

.section-title,
.files-title {
  font-size: 1.5vw;
  font-weight: 800;
  color: #f4fbff;
  text-shadow: 0 2px 9px #0009;
}
.section-title {
  margin: 1vh 0 .9vh;
}
.tiles {
  display: grid;
  grid-template-columns: repeat(6,minmax(0,1fr));
  gap: 1vw;
}
.tile {
  height: 11.2vh;
  padding: .65vw;
  border: 1px solid #ffffff70;
  border-radius: 1.2vw;
  background: linear-gradient(
    145deg,#173b67ee,#08192fee
  );
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5vw;
  text-align: center;
  font-size: 1.55vw;
  font-weight: 800;
  box-shadow: 0 8px 19px #0007;
}
.tile.light {
  background: linear-gradient(150deg,#fff,#dce6f4);
  color: #141f34;
}
.tile.blue {
  background: linear-gradient(135deg,#174bfa,#04135b);
}
.tile.dark {
  background: linear-gradient(150deg,#10253d,#081323);
}
.tile.web {
  border: 2px solid #4feaff;
  background: linear-gradient(135deg,#0a4a91,#061b40);
  box-shadow: 0 0 18px #00bfff;
}
/* Dlaždice aplikací: skutečné bannery z TV (poměr cca 16:9) */
#appTiles .tile { height: 14vh; }
.tile.has-banner {
  padding: 0;
  overflow: hidden;
  background: #000;
  border-color: #ffffff40;
}
.tile.has-banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.tile img.app-icon {
  width: 6vh;
  height: 6vh;
  object-fit: contain;
}
.tile.missing { opacity: .4; }
#files {
  border: 2px solid #36d7ff;
  border-radius: 1.3vw;
  background: linear-gradient(
    180deg,#082c52ee,#041428f5
  );
  padding: 1vw 1.2vw;
  display: flex;
  align-items: center;
  gap: 1vw;
  box-shadow: 0 0 17px #0dbbff88;
  min-height: 13vh;
  margin-top: .8vh;
}
.files-title {
  width: 22%;
}
.files-title .sub {
  font-size: 1vw;
  font-weight: 400;
  margin-top: .5vh;
  color: #d8ebf7;
}
.action {
  height: 9vh;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 1vw;
  border: 1px solid #ffffff66;
  border-radius: 1vw;
  background: linear-gradient(
    110deg,#235987ee,#102b4be8
  );
  padding: 1vw;
  text-align: left;
  font-size: 1.1vw;
  font-weight: 700;
}
.action .symbol { font-size: 2vw; }
.action small {
  display: block;
  font-size: .85vw;
  font-weight: 400;
  margin-top: .35vh;
  color: #d9e8f5;
}
#toast {
  position: fixed;
  z-index: 30;
  left: 30%;
  right: 30%;
  bottom: 15%;
  text-align: center;
  background: #081b34ee;
  border: 1px solid #19d2ff;
  padding: 1.5vw;
  border-radius: 1vw;
  font-size: 1.35vw;
  display: none;
}
#toast.show { display: block; }
#edit {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #000c;
  align-items: center;
  justify-content: center;
}
#edit > div {
  background: #0a203b;
  padding: 2vw;
  border-radius: 1vw;
  width: 52%;
  max-height: 88vh;
  overflow: auto;
  border: 2px solid #33dfff;
  box-shadow: 0 0 30px #13cfff66;
}
#edit h2 { margin: 0 0 1vh; font-size: 1.8vw; }
#edit h3 { margin: 2.5vh 0 .5vh; font-size: 1.4vw; }
#edit input {
  width: 100%;
  font-size: 1.4vw;
  padding: 1vw;
  margin: 1vh 0;
  color: black;
  border-radius: .5vw;
  border: 0;
}
#edit input:focus {
  outline: 3px solid #14cfff;
  box-shadow: 0 0 15px 4px #07cfffaa;
}
#edit button {
  background: #1e9ec2;
  border: 0;
  border-radius: .6vw;
  padding: .7vw 1.2vw;
  margin: .5vw .5vw .5vw 0;
  font-size: 1.2vw;
  font-weight: 700;
}
#edit button.danger { background: #a3263a; }
.site-row {
  display: flex;
  align-items: center;
  gap: 1vw;
  padding: .6vh 0;
  border-bottom: 1px solid #ffffff33;
}
.site-row .site-info { flex: 1; min-width: 0; }
.site-row .site-name { font-size: 1.3vw; font-weight: 700; }
.site-row .site-url {
  font-size: .95vw;
  color: #b9cfe2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#version {
  position: fixed;
  right: 2.4vw;
  bottom: 1vh;
  font-size: .85vw;
  color: #ffffff66;
  pointer-events: none;
}
.muted { color: #c6d7e6; }

.apps-heading{display:flex;align-items:center;justify-content:space-between}
#sortApps{background:#123d68;border:1px solid #56dfff;border-radius:.7vw;padding:.35vw .9vw;font-size:1.06vw;font-weight:700}
.order-backdrop{display:none;position:fixed;inset:0;z-index:20;background:#000c;align-items:center;justify-content:center}
.order-panel{width:min(760px,85vw);max-height:85vh;overflow:auto;padding:28px;border:2px solid #38dafa;border-radius:20px;background:#091c35;box-shadow:0 0 30px #13cfff66}
.order-panel h2{margin:0 0 10px}.order-panel p{font-size:19px;color:#d9eaf7;margin:0 0 18px}
.order-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff33;font-size:22px}
.order-row .app-name{flex:1}.order-row button,.order-close{min-width:60px;min-height:45px;border:1px solid #6be7ff;border-radius:10px;background:#124875;font-size:21px;font-weight:bold}
.order-row button:disabled{opacity:.35}.order-close{display:block;margin:22px 0 0 auto;padding:10px 25px}
</style>
</head>

<body>
<div id="scene"></div>
<div class="shade"></div>

<main>
<header>
  <div class="logo">
    <svg class="logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    BroZam TV
  </div>
  <nav class="nav">
    <button class="selected" onclick="goHome()" title="Zpět na domovskou obrazovku TV">⌂ Domů</button>
  </nav>
  <div class="right" id="headClock">--:--</div>
</header>

<div id="dashboard">
  <div class="clock">
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date">Načítám datum…</div>
  </div>

  <div class="weather">
    <div class="now">
      <div class="place">📍 Ostrožská Lhota</div>
      <div class="now-row">
        <span class="now-ico" id="nowIco"></span>
        <div>
          <div class="temperature" id="temp">--°C</div>
          <div class="description" id="desc">Načítám počasí…</div>
        </div>
      </div>
    </div>
    <div class="fc">
      <div class="fc-title">3denní předpověď</div>
      <div class="forecast" id="forecast"></div>
    </div>
  </div>
</div>

<div>
  <div class="section-title apps-heading">▦ Aplikace <button id="sortApps" onclick="openOrder()">↕ Pořadí aplikací</button></div>
  <div class="tiles" id="appTiles">
    <button class="tile blue" data-app="oneplay" onclick="app('oneplay')">oneplay</button>
    <button class="tile light" data-app="netflix" onclick="app('netflix')" style="color:#e50914">NETFLIX</button>
    <button class="tile light" data-app="youtube" onclick="app('youtube')">▶ YouTube</button>
    <button class="tile light" data-app="kodi" onclick="app('kodi')" style="color:#169dcb">◆ KODI</button>
    <button class="tile light" data-app="ct" onclick="app('ct')">◩ ČT</button>
    <button class="tile dark" data-app="spotify" onclick="app('spotify')" style="color:#1ed760">◉ Spotify</button>
  </div>
</div>

<div>
  <div class="section-title">◎ Webové stránky</div>
  <div class="tiles" id="webTiles">
    <button class="tile web" onclick="browse('https://www.google.cz/')">🔍 Google.cz</button>
    <button class="tile light" onclick="browse('https://www.seznam.cz/')">Seznam.cz</button>
    <button class="tile dark" onclick="browse('https://mylivebeat-dcf59.web.app/')">♫ My Live Beat</button>
    <button class="tile dark" onclick="browse('https://www.csfd.cz/')">🎬 ČSFD.cz</button>
    <button class="tile dark" onclick="browse('https://claude.ai/')">✳ Claude.ai</button>
    <button class="tile" id="addWebTile" onclick="addWeb()">＋ Přidat web</button>
  </div>
</div>

<div id="files">
  <div class="files-title">
    📁 Správce souborů
    <div class="sub">Stažené a sdílené soubory</div>
  </div>

  <button class="action" onclick="files()">
    <span class="symbol">⬇</span>
    <div>Stažené soubory
      <small>PDF, dokumenty, obrázky</small>
    </div>
  </button>

  <button class="action" onclick="sendLocal()">
    <span class="symbol">⇄</span>
    <div>Odeslat do PC – LocalSend
      <small>Přenos po domácí síti</small>
    </div>
  </button>

  <button class="action" onclick="drive()">
    <span class="symbol">▲</span>
    <div>Nahrát na Google Disk
      <small>Otevře Disk v prohlížeči</small>
    </div>
  </button>
</div>
</main>

<div id="toast" role="status"></div>
<div id="orderModal" class="order-backdrop" role="dialog" aria-label="Pořadí aplikací">
  <div class="order-panel">
    <h2>↕ Pořadí aplikací</h2>
    <p>Šipkami ↑ a ↓ změň pořadí. Uloží se automaticky.</p>
    <div id="orderRows"></div>
    <button class="order-close" onclick="closeOrder()">Hotovo</button>
  </div>
</div>

<div id="edit" role="dialog" aria-label="Moje weby">
  <div>
    <h2 id="editTitle">＋ Přidat web</h2>
    <input id="webName" placeholder="Název webu">
    <input id="webUrl" placeholder="adresa.cz nebo https://adresa.cz">
    <div>
      <button onclick="saveWeb()">Uložit</button>
      <button onclick="closeEdit()">Zavřít</button>
    </div>
    <div id="siteListBox">
      <h3>Moje weby</h3>
      <div id="siteList"></div>
    </div>
  </div>
</div>

<div id="version"></div>

<script>
'use strict';

const hasTV = () => typeof TV !== 'undefined';

function call(name, ...args) {
  if (hasTV() && TV[name]) {
    return TV[name](...args);
  }
  return false;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3600);
}

function app(name) {
  if (!hasTV()) {
    toast('Na televizi se spustí aplikace ' + name);
    return;
  }
  call('app', name);
}

function browse(url) {
  if (hasTV()) {
    call('browse', url);
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

function files() {
  if (hasTV()) {
    call('files');
  } else {
    toast('Na TV se otevře systémový výběr souborů');
  }
}

function drive() {
  if (hasTV()) {
    call('share', 'drive');
  } else {
    browse('https://drive.google.com/drive/u/0/my-drive');
  }
}

function sendLocal() {
  if (hasTV()) {
    call('share', 'localsend');
  } else {
    toast('Na TV se spustí LocalSend');
  }
}

// Odejde z BroZam TV na domovskou obrazovku televize (Google TV).
function goHome() {
  if (hasTV()) call('home');
  else toast('Na TV se otevře domovská obrazovka televize');
}

const weekdays = [
  'neděle','pondělí','úterý','středa',
  'čtvrtek','pátek','sobota'
];

const months = [
  'ledna','února','března','dubna',
  'května','června','července','srpna',
  'září','října','listopadu','prosince'
];

function pad(n) {
  return String(n).padStart(2, '0');
}

function clock() {
  const d = new Date();
  const s = pad(d.getHours()) + ':' + pad(d.getMinutes());

  document.getElementById('clock').textContent = s;
  document.getElementById('headClock').textContent = s;

  const w = weekdays[d.getDay()];
  document.getElementById('date').textContent =
    w[0].toUpperCase() + w.slice(1) + ', ' +
    d.getDate() + '. ' + months[d.getMonth()] +
    ' ' + d.getFullYear();
}

clock();
setInterval(clock, 10000);

// Kódy WMO z Open-Meteo: [od, do, popis, ikona]
const weatherLabels = [
  [0, 0, 'Jasno', '☀️'],
  [1, 1, 'Převážně jasno', '🌤️'],
  [2, 2, 'Polojasno', '⛅'],
  [3, 3, 'Zataženo', '☁️'],
  [45, 48, 'Mlha', '🌫️'],
  [51, 55, 'Mrholení', '🌦️'],
  [56, 57, 'Mrznoucí mrholení', '🌧️'],
  [61, 63, 'Déšť', '🌧️'],
  [65, 65, 'Silný déšť', '🌧️'],
  [66, 67, 'Mrznoucí déšť', '🌧️'],
  [71, 73, 'Sníh', '🌨️'],
  [75, 75, 'Silné sněžení', '❄️'],
  [77, 77, 'Sněhová zrna', '🌨️'],
  [80, 82, 'Přeháňky', '🌦️'],
  [85, 86, 'Sněhové přeháňky', '🌨️'],
  [95, 95, 'Bouřky', '⛈️'],
  [96, 99, 'Bouřky s kroupami', '⛈️']
];

function weatherIcon(code) {
  const x = weatherLabels.find(w => code >= w[0] && code <= w[1]);
  return x ? [code, x[2], x[3]] : [code, 'Proměnlivo', '🌤️'];
}

function setWeather(d) {
  try {
    const c = d.current;
    const dy = d.daily;

    document.getElementById('temp').textContent =
      Math.round(c.temperature_2m) + '°C';

    const v = weatherIcon(c.weather_code);

    document.getElementById('nowIco').textContent = v[2];
    document.getElementById('desc').textContent = v[1];

    const days = ['Ne','Po','Út','St','Čt','Pá','So'];

    // Dnešek je vlevo jako aktuální počasí, předpověď začíná zítřkem.
    const start = dy.time.length > 3 ? 1 : 0;

    document.getElementById('forecast').innerHTML =
      dy.time.slice(start, start + 3).map((day, k) => {
        const i = start + k;
        const date = new Date(day + 'T12:00:00');

        return '<section>' +
          '<div class="day">' + days[date.getDay()] + '</div>' +
          '<div class="ico">' +
          weatherIcon(dy.weather_code[i])[2] + '</div>' +
          '<strong>' +
          Math.round(dy.temperature_2m_max[i]) + '°C / ' +
          Math.round(dy.temperature_2m_min[i]) + '°C' +
          '</strong></section>';
      }).join('');

  } catch (e) {
    weatherError();
  }
}

function weatherError() {
  document.getElementById('desc').textContent =
    'Počasí není dostupné';
}

// Stejná adresa jako v MainActivity (dnešek + 3 další dny).
const WEATHER_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=48.98&longitude=17.47' +
  '&current=temperature_2m,weather_code' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
  '&timezone=Europe%2FPrague&forecast_days=4';

if (!hasTV()) {
  fetch(WEATHER_URL)
  .then(r => r.json())
  .then(setWeather)
  .catch(weatherError);
}

// ----- Moje weby: přidat, upravit, smazat -----

let editIndex = -1;      // -1 = nový web, jinak index upravovaného
let deleteArmed = -1;    // první stisk „Smazat“ jen potvrzuje

function loadSites() {
  try {
    const s = JSON.parse(localStorage.getItem('sites') || '[]');
    return Array.isArray(s) ? s.filter(x => x && x.name && x.url) : [];
  } catch (e) {
    return [];
  }
}

function storeSites(sites) {
  localStorage.setItem('sites', JSON.stringify(sites));
}

function isOpen(id) {
  return document.getElementById(id).style.display === 'flex';
}

function resetForm() {
  editIndex = -1;
  deleteArmed = -1;
  document.getElementById('editTitle').textContent = '＋ Přidat web';
  document.getElementById('webName').value = '';
  document.getElementById('webUrl').value = '';
}

function closeEdit() {
  document.getElementById('edit').style.display = 'none';
  resetForm();
  document.getElementById('addWebTile').focus();
}

function addWeb() {
  resetForm();
  renderSiteList();
  document.getElementById('edit').style.display = 'flex';
  document.getElementById('webName').focus();
}

// Doplní https:// když chybí („seznam.cz“ → „https://seznam.cz/“).
// IP adresy a *.local (router, kamera v domácí síti) dostanou http://.
function safeUrl(url) {
  if (url && !/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) {
    const host = url.split(/[/:]/)[0];
    const local = /^\d{1,3}(\.\d{1,3}){3}$/.test(host) ||
      /\.local$/i.test(host) || host === 'localhost';
    url = (local ? 'http://' : 'https://') + url;
  }
  try {
    const u = new URL(url);
    return ['https:', 'http:'].includes(u.protocol) && u.hostname
      ? u.href : null;
  } catch (e) {
    return null;
  }
}

function saveWeb() {
  const name = document.getElementById('webName').value.trim();
  const url = safeUrl(document.getElementById('webUrl').value.trim());

  if (!name || !url) {
    toast('Zadej název a platnou adresu (např. seznam.cz)');
    return;
  }

  const sites = loadSites();

  if (editIndex >= 0 && editIndex < sites.length) {
    sites[editIndex] = {name, url};
    toast('Web upraven: ' + name);
  } else {
    sites.push({name, url});
    toast('Web přidán: ' + name);
  }

  storeSites(sites);
  renderCustom();
  resetForm();
  renderSiteList();
  document.getElementById('webName').focus();
}

function editSite(i) {
  const site = loadSites()[i];
  if (!site) return;

  editIndex = i;
  deleteArmed = -1;
  document.getElementById('editTitle').textContent = '✎ Upravit web';
  document.getElementById('webName').value = site.name;
  document.getElementById('webUrl').value = site.url;
  renderSiteList();
  document.getElementById('webName').focus();
}

function deleteSite(i) {
  // Ochrana před omylem: první stisk se jen zeptá.
  if (deleteArmed !== i) {
    deleteArmed = i;
    renderSiteList();
    const b = document.querySelector('[data-del="' + i + '"]');
    if (b) b.focus();
    return;
  }

  const sites = loadSites();
  const removed = sites.splice(i, 1)[0];
  storeSites(sites);
  if (editIndex === i) resetForm();
  else if (editIndex > i) editIndex--;
  deleteArmed = -1;

  renderCustom();
  renderSiteList();
  if (removed) toast('Web smazán: ' + removed.name);

  const next = document.querySelector(
    '[data-del="' + Math.min(i, sites.length - 1) + '"]');
  (next || document.getElementById('webName')).focus();
}

function renderSiteList() {
  const sites = loadSites();
  const box = document.getElementById('siteListBox');
  const list = document.getElementById('siteList');

  list.textContent = '';
  box.style.display = sites.length ? 'block' : 'none';

  sites.forEach((site, i) => {
    const row = document.createElement('div');
    row.className = 'site-row';

    const info = document.createElement('div');
    info.className = 'site-info';
    const n = document.createElement('div');
    n.className = 'site-name';
    n.textContent = site.name;
    const u = document.createElement('div');
    u.className = 'site-url';
    u.textContent = site.url;
    info.append(n, u);

    const edit = document.createElement('button');
    edit.textContent = '✎ Upravit';
    edit.onclick = () => editSite(i);

    const del = document.createElement('button');
    del.className = 'danger';
    del.dataset.del = i;
    del.textContent = deleteArmed === i ? 'Opravdu smazat?' : '🗑 Smazat';
    del.onclick = () => deleteSite(i);

    row.append(info, edit, del);
    list.appendChild(row);
  });
}

function renderCustom() {
  document.querySelectorAll('.custom-site')
    .forEach(e => e.remove());

  const sites = loadSites();

  sites.forEach(site => {
    const b = document.createElement('button');
    b.className = 'tile dark custom-site';
    b.textContent = site.name;

    b.addEventListener('click', () => browse(site.url));

    // Vlastní weby se vkládají před „Přidat web“, ten zůstává poslední.
    document.getElementById('webTiles').insertBefore(
      b, document.getElementById('addWebTile'));
  });
}

renderCustom();

// Pořadí aplikací se ukládá pouze v BroZam TV, nezasahuje do systému Google TV.
const defaultAppNames = {oneplay:'Oneplay',netflix:'Netflix',youtube:'YouTube',kodi:'Kodi',ct:'ČT',spotify:'Spotify'};
function appOrder(){
  const keys=Object.keys(defaultAppNames);
  let saved=[];
  try {saved=JSON.parse(localStorage.getItem('brozamAppOrder')||'[]');}catch(e){}
  if(!Array.isArray(saved))saved=[];
  return [...new Set([...saved.filter(k=>keys.includes(k)),...keys])];
}
function paintAppOrder(){
 const root=document.getElementById('appTiles');
 const tiles=Object.fromEntries([...root.children].map(el=>[el.dataset.app,el]));
 appOrder().forEach(k=>{if(tiles[k])root.appendChild(tiles[k]);});
}
function openOrder(){
 document.getElementById('orderModal').style.display='flex';
 paintOrderRows();
 const btn=document.querySelector('#orderRows button:not(:disabled)');if(btn)btn.focus();
}
function closeOrder(){document.getElementById('orderModal').style.display='none';document.getElementById('sortApps').focus();}
function moveApp(key,delta){
 const order=appOrder(),i=order.indexOf(key),j=i+delta;
 if(i<0||j<0||j>=order.length)return;
 [order[i],order[j]]=[order[j],order[i]];
 localStorage.setItem('brozamAppOrder',JSON.stringify(order));
 paintAppOrder();paintOrderRows();
 const b=document.querySelector('[data-move="'+key+':'+delta+'"]');if(b)b.focus();
}
function paintOrderRows(){
 const root=document.getElementById('orderRows');root.textContent='';
 const order=appOrder();
 order.forEach((key,i)=>{
  const row=document.createElement('div');row.className='order-row';
  const name=document.createElement('span');name.className='app-name';name.textContent=defaultAppNames[key];row.appendChild(name);
  for(const delta of [-1,1]){
   const btn=document.createElement('button');btn.textContent=delta<0?'↑':'↓';
   btn.dataset.move=key+':'+delta;btn.disabled=(i+delta<0||i+delta>=order.length);
   btn.setAttribute('aria-label','Posunout '+defaultAppNames[key]+(delta<0?' nahoru':' dolů'));
   btn.onclick=()=>moveApp(key,delta);row.appendChild(btn);
  }
  root.appendChild(row);
 });
}
paintAppOrder();

// Bannery / ikony aplikací posílá Java (MainActivity.loadAppImages).
// map = { netflix: {installed:true, banner:'data:image/png;base64,…'}, … }
function setAppImages(map) {
  document.querySelectorAll('#appTiles .tile').forEach(tile => {
    const info = map && map[tile.dataset.app];
    if (!info) return;

    if (!tile.dataset.label) {
      tile.dataset.label = tile.textContent.trim();
    }
    const label = tile.dataset.label;
    const missing = info.installed === false;

    tile.classList.toggle('missing', missing);
    tile.setAttribute('aria-label',
      label + (missing ? ' – není nainstalovaná' : ''));

    if (info.banner) {
      const img = document.createElement('img');
      img.src = info.banner;
      img.alt = label;
      tile.classList.add('has-banner');
      tile.replaceChildren(img);
    } else if (info.icon) {
      const img = document.createElement('img');
      img.src = info.icon;
      img.alt = '';
      img.className = 'app-icon';
      const text = document.createElement('span');
      text.textContent = label;
      tile.classList.remove('has-banner');
      tile.replaceChildren(img, text);
    } else {
      tile.classList.remove('has-banner');
      tile.textContent = label;
    }
  });
}

// Tlačítko Zpět (volá MainActivity.onBackPressed): zavře otevřené okno.
// Vrací true, když něco zavřelo; jinak aplikace odejde na TV.
function handleBack() {
  if (isOpen('orderModal')) { closeOrder(); return true; }
  if (isOpen('edit')) { closeEdit(); return true; }
  return false;
}

// Vlastní navigace šipkami: vybere nejbližší tlačítko v daném směru.
// Při otevřeném okně se pohybuje jen uvnitř něj.
function activeRoot() {
  if (isOpen('orderModal')) return document.getElementById('orderModal');
  if (isOpen('edit')) return document.getElementById('edit');
  return document.querySelector('main');
}

function focusables(root) {
  return [...root.querySelectorAll('button, input')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}

function moveFocus(dir) {
  const items = focusables(activeRoot());
  if (!items.length) return;

  const cur = document.activeElement;
  if (!items.includes(cur)) {
    items[0].focus();
    return;
  }

  const r = cur.getBoundingClientRect();
  // Vzdálenost dvou úseků na ose (0, když se překrývají).
  const gap = (a1, a2, b1, b2) =>
    Math.max(0, Math.max(a1, b1) - Math.min(a2, b2));
  let best = null;
  let bestScore = Infinity;

  for (const el of items) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect();
    let main;   // vzdálenost ve směru pohybu
    let cross;  // odsazení do strany
    let align;  // zarovnání (rozhoduje mezi stejně blízkými)

    if (dir === 'left' || dir === 'right') {
      main = dir === 'left' ? r.left - q.right : q.left - r.right;
      cross = gap(r.top, r.bottom, q.top, q.bottom);
      align = Math.abs(q.top - r.top);
    } else {
      main = dir === 'up' ? r.top - q.bottom : q.top - r.bottom;
      cross = gap(r.left, r.right, q.left, q.right);
      align = Math.abs(q.left - r.left);
    }
    if (main < -1) continue;

    const score = main + cross * 3 + align * 0.1;
    if (score < bestScore) {
      bestScore = score;
      best = el;
    }
  }

  if (best) {
    best.focus();
    best.scrollIntoView({block: 'nearest'});
  }
}

const arrowDirs = {
  ArrowLeft: 'left', ArrowRight: 'right',
  ArrowUp: 'up', ArrowDown: 'down'
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (handleBack()) e.preventDefault();
    return;
  }

  const dir = arrowDirs[e.key];
  if (!dir) return;

  // V textovém poli šipky doleva/doprava posouvají kurzor v textu.
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && (dir === 'left' || dir === 'right')) {
    return;
  }

  e.preventDefault();
  moveFocus(dir);
});

function refreshWeather() {
  if (document.hidden) return;
  if (hasTV()) {
    call('weather');
  } else {
    fetch(WEATHER_URL)
      .then(r => { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); })
      .then(setWeather)
      .catch(weatherError);
  }
}
setInterval(refreshWeather, 30 * 60 * 1000);
if (!hasTV()) {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshWeather();
  });
}
